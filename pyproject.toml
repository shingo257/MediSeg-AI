[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediseg-ai"
version = "0.1.0"
description = "Medical Image Segmentation AI Project"
authors = [{name = "MediSeg.AI Team", email = "team@mediseg.ai"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "tensorflow>=2.10.0",
    "opencv-python>=4.6.0",
    "albumentations>=1.3.0",
    "scikit-image>=0.19.0",
    "Pillow>=9.0.0",
    "SimpleITK>=2.2.0",
    "nibabel>=4.0.0",
    "pydicom>=2.3.0",
    "numpy>=1.21.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "jupyter>=1.0.0",
    "tqdm>=4.64.0",
    "tensorboard>=2.10.0",
    "wandb>=0.13.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gui-web = [
    "Flask>=2.0.0",
]
gui-desktop = [
    "PyQt5>=5.15.0",
]
dev = [
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["mediseg_ai*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
